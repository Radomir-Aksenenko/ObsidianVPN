name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "ios/**"
      - "pkg/mobile/**"
      - "obsidian/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "pkg/mobile/**"
      - "obsidian/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build iOS IPA (Device ARM64)
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show toolchain versions
        run: |
          go version
          xcodebuild -version
          swift --version

      - name: Test mobile package
        run: go test ./pkg/mobile

      - name: Install Go Mobile and XcodeGen
        run: |
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          brew install xcodegen

      - name: Build Go Mobile XCFramework
        run: |
          mkdir -p ios/Frameworks
          gomobile bind \
            -target=ios,iossimulator \
            -o ios/Frameworks/Obsidian.xcframework \
            ./pkg/mobile

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iOS device app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ObsidianVPN.xcodeproj \
            -scheme ObsidianVPN \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/ObsidianDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/ios-build.log"

      - name: Package into IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/ObsidianDerivedData/Build/Products/Release-iphoneos/ObsidianVPN.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r -y "ObsidianVPN.ipa" "Payload"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianVPN-iOS-IPA
          path: ${{ runner.temp }}/ObsidianVPN.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub Release Asset
        if: github.ref == 'refs/heads/codex/ios-github-build' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release upload ios-latest "$RUNNER_TEMP/ObsidianVPN.ipa" --clobber
          else
            gh release create ios-latest "$RUNNER_TEMP/ObsidianVPN.ipa" \
              --title "Obsidian VPN iOS (ARM64 .ipa)" \
              --notes "Unsigned .ipa ready for signing with ESign / Scarlet / GBox / Feather." \
              --prerelease
          fi

