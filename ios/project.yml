name: ObsidianVPN

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: ru

targets:
  ObsidianVPN:
    type: application
    platform: iOS
    sources:
      - path: ObsidianVPN
    dependencies:
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsidian.vpn
        CODE_SIGN_ENTITLEMENTS: Config/ObsidianVPN.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    info:
      path: Generated/ObsidianVPN-Info.plist
      properties:
        CFBundleDisplayName: Obsidian
        CFBundleName: ObsidianVPN
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: "Камера используется для сканирования QR-кодов с ключами серверов Obsidian."

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    dependencies:
      - framework: Frameworks/Obsidian.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsidian.vpn.PacketTunnel
        CODE_SIGN_ENTITLEMENTS: Config/PacketTunnel.entitlements
        SKIP_INSTALL: YES
    info:
      path: Generated/PacketTunnel-Info.plist
      properties:
        CFBundleDisplayName: Obsidian Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
